# Pre-commit hooks for Research Agent
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Secret scanning - prevent accidental credential commits
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(\.env\.example|package-lock\.json|\.secrets\.baseline)$'

  # Python linting & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.12.0, pydantic-settings>=2.1.0]
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  # Spelling — typos in code, prompts, and docs are defects (EXECUTION-PLAN §0b.12)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # The artifacts folder holds verbatim source text and fixture data;
        # a source's own typo is part of the record, not a defect to fix.
        args: ['--skip', '*.json,*.lock,venv,node_modules,docs/_archive_do_not_read,plans/260814-claim-graph-briefing/artifacts', '--ignore-words-list', 'hawara,fayoum,herodotus,nomes,strabo,nd']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        args: ['--branch', 'main']
