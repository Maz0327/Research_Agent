<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Agent — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          surface: { 0: '#0a0a0f', 1: '#12121a', 2: '#1a1a25', 3: '#222230', hover: '#2a2a38' },
          accent: { blue: '#3b82f6', purple: '#8b5cf6', green: '#22c55e' },
          txt: { primary: '#f5f5f5', secondary: '#a1a1aa', muted: '#71717a', disabled: '#52525b' },
          border: { default: '#27272a', hover: '#3f3f46', accent: '#3b82f6' }
        }
      }}
    }
  </script>
  <style>
    .glow-logo { filter: drop-shadow(0 0 30px rgba(59,130,246,0.3)); }
    .bg-grid { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size: 40px 40px; }
  </style>
</head>
<body class="bg-surface-0 text-txt-primary font-sans antialiased min-h-screen flex items-center justify-center bg-grid">

  <div class="w-full max-w-sm px-6">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-accent-blue to-accent-purple flex items-center justify-center mb-4 glow-logo">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 14.5M14.25 3.104c.251.023.501.05.75.082M19.8 14.5l-2.147 2.146a2.25 2.25 0 01-1.591.659H7.938a2.25 2.25 0 01-1.591-.659L4.2 14.5" /></svg>
      </div>
      <h1 class="text-xl font-bold">Research Agent</h1>
      <p class="text-sm text-txt-muted mt-1">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-surface-1 border border-border-default rounded-2xl p-6">
      <!-- Google OAuth -->
      <button class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-surface-2 border border-border-default hover:border-border-hover hover:bg-surface-hover text-sm font-medium transition-colors cursor-pointer mb-4">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-border-default"></div>
        <span class="text-[10px] text-txt-disabled uppercase tracking-wider">or</span>
        <div class="flex-1 h-px bg-border-default"></div>
      </div>

      <!-- Email Form -->
      <form class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-txt-secondary mb-1.5">Email</label>
          <input type="email" placeholder="you@example.com" class="w-full bg-surface-2 text-sm rounded-xl px-4 py-2.5 border border-border-default focus:border-accent-blue focus:outline-none transition-colors placeholder:text-txt-disabled" />
        </div>
        <div>
          <label class="block text-xs font-medium text-txt-secondary mb-1.5">Password</label>
          <input type="password" placeholder="••••••••" class="w-full bg-surface-2 text-sm rounded-xl px-4 py-2.5 border border-border-default focus:border-accent-blue focus:outline-none transition-colors placeholder:text-txt-disabled" />
        </div>
        <button type="submit" class="w-full px-4 py-2.5 rounded-xl bg-accent-blue hover:bg-accent-blue/90 text-white text-sm font-medium transition-colors cursor-pointer">
          Sign In
        </button>
      </form>

      <!-- Magic Link -->
      <button class="w-full mt-3 text-xs text-txt-muted hover:text-accent-blue transition-colors cursor-pointer py-2">
        Send me a magic link instead
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-[10px] text-txt-disabled mt-6">
      By signing in, you agree to our Terms of Service
    </p>
  </div>

</body>
</html>
